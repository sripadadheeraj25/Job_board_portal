{% extends 'base.html' %}

{% block title %}Delete Job{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4 text-center">
                <h3 class="text-danger mb-3">Delete this job?</h3>
                <p class="mb-1"><strong>{{ job.title }}</strong></p>
                <p class="text-muted mb-4">{{ job.company }}</p>
                <p class="text-secondary mb-4">
                    This will permanently delete the job and all
                    applications submitted for it.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        Yes, Delete
                    </button>
                    <a href="{% url 'job_detail' job.pk %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
